name: MEMMY-592 related regression validation

on:
  push:
    branches: [fix/memmy-592-task-evidence]
    paths-ignore: ['.github/workflows/memmy-592-*.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memmy-592-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    if: github.repository == 'yxyi123/memmy-agent'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Agent dependencies
        run: npm ci --prefix App/memmy-agent --no-audit --no-fund
      - name: Typecheck Agent and tests
        run: npm --prefix App/memmy-agent run typecheck
      - name: Build Agent
        if: ${{ !cancelled() }}
        run: npm --prefix App/memmy-agent run build
      - name: Test output locations and related runtime integration
        if: ${{ !cancelled() }}
        working-directory: App/memmy-agent
        run: |
          selection=()
          if [ "${{ runner.os }}" = Windows ]; then
            # These exact assertions also failed on unmodified v1.2.2 in run 38051656977.
            # Per requested scope, retain that evidence rather than re-running unrelated failures.
            selection+=(--testNamePattern '^(?!.*(?:emits file edit progress around write_file execution|aborts the active websocket turn without synthesizing a final answer on /stop)).*$')
          fi
          npm test -- tests/core/agent-runtime/tools/output-location.test.ts tests/core/agent-runtime/tools/filesystem-tools.test.ts tests/core/agent-runtime/tools/apply-patch-tool.test.ts tests/core/agent-runtime/tools/patch-envelope.test.ts tests/core/agent-runtime/tools/subagent-tools.test.ts tests/core/agent-runtime/loop-progress.test.ts tests/core/agent-runtime/task-cancel.test.ts tests/core/agent-runtime/runner tests/core/agent-runtime/loop-runner-integration.test.ts tests/core/agent-runtime/subagent.test.ts tests/core/agent-runtime/subagent-lifecycle.test.ts tests/core/agent-runtime/lifecycle-hooks.test.ts tests/memmy-memory/runner-deadline.test.ts tests/memmy-memory/interactive-deadline.test.ts tests/memmy-memory/hook.test.ts tests/memmy-memory/client-tools.test.ts "${selection[@]}" --reporter=default --reporter=json --outputFile=memmy-592-runtime-results.json
      - name: Preserve test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: memmy-592-agent-${{ matrix.runner }}
          path: App/memmy-agent/memmy-592-*-results.json
          if-no-files-found: warn
          retention-days: 7

  repository:
    if: github.repository == 'yxyi123/memmy-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Agent dependencies
        run: npm ci --prefix App/memmy-agent --no-audit --no-fund
      - name: Check repository lint
        run: npm run lint
      - name: Check repository types
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Check changed Agent source and tests lint
        if: ${{ !cancelled() }}
        working-directory: App/memmy-agent
        run: >-
          npx --no-install eslint src/core/agent-runtime/loop.ts
          src/core/agent-runtime/runner.ts src/core/agent-runtime/subagent.ts
          src/core/agent-runtime/tools/apply-patch.ts src/core/agent-runtime/tools/base.ts
          src/core/agent-runtime/tools/filesystem.ts src/core/agent-runtime/tools/loader.ts
          src/core/agent-runtime/tools/output-location.ts src/core/agent-runtime/tools/shell.ts
          src/core/agent-runtime/tools/spawn.ts tests/core/agent-runtime/loop-progress.test.ts
          tests/core/agent-runtime/task-cancel.test.ts tests/core/agent-runtime/tools/output-location.test.ts
      - name: Related release and packaging guards
        if: ${{ !cancelled() }}
        run: npm run test:release-workflow && npm run test:packaging-guards
      - name: Desktop runtime package and upgrade regression
        if: ${{ !cancelled() }}
        run: npm test -w @memmy/desktop -- tests/runtime-memory-upgrade.test.ts tests/packaged-runtime-boundary.test.ts
      - name: Check clean source after builds and tests
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Record scope
        if: ${{ always() }}
        run: |
          printf '%s\n' 'Scoped integration validation after merging v1.2.2. Covers output routing, runtime and Memory hook integration, cancellation, packaging and runtime upgrade. The prior full-suite failures remain documented in runs 38050423765, 38051656977 and 38052129075; this run does not mark those suites as passing. No PR, release or deployment is created.' >> "$GITHUB_STEP_SUMMARY"
