name: MEMMY-592 baseline failure comparison

on:
  push:
    branches: [fix/memmy-592-task-evidence]
    paths: ['.github/workflows/memmy-592-baseline-comparison.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memmy-592-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    if: github.repository == 'yxyi123/memmy-agent'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
        revision: [baseline, candidate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && 'fa12bd06e0d1de9a4bf1e23f321b0e833d064c22' || '20b8eddd89f6d2374fe43ec050d481cad3a24d12' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record environment and revision
        run: |
          mkdir -p comparison-evidence
          git rev-parse HEAD > comparison-evidence/commit.txt
          node --version > comparison-evidence/node.txt
          npm --version > comparison-evidence/npm.txt
          uname -a > comparison-evidence/platform.txt
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Agent dependencies
        run: npm ci --prefix App/memmy-agent --no-audit --no-fund
      - name: Typecheck Agent and tests
        run: npm --prefix App/memmy-agent run typecheck
      - name: Build Agent
        if: ${{ !cancelled() }}
        run: npm --prefix App/memmy-agent run build
      - name: Full Agent regression with original assertions
        if: ${{ !cancelled() }}
        working-directory: App/memmy-agent
        run: |
          set -o pipefail
          npm test -- --reporter=default --reporter=json --outputFile=../../comparison-evidence/agent-full.json 2>&1 | tee ../../comparison-evidence/agent-full.log
      - name: Repeat failure-prone runtime suites three times
        if: ${{ !cancelled() }}
        working-directory: App/memmy-agent
        run: |
          set +e
          set -o pipefail
          failed=0
          for attempt in 1 2 3; do
            npm test -- tests/session-dag/builder-queue.test.ts tests/core/agent-runtime/loop-progress.test.ts tests/core/agent-runtime/task-cancel.test.ts tests/core/agent-runtime/loop-goal-continuation.test.ts tests/core/agent-runtime/long-document-review.test.ts tests/core/agent-runtime/tools/exec-session-tools.test.ts --reporter=default --reporter=json --outputFile=../../comparison-evidence/agent-repeat-$attempt.json 2>&1 | tee ../../comparison-evidence/agent-repeat-$attempt.log
            result=${PIPESTATUS[0]}
            printf '%s\n' "$result" > ../../comparison-evidence/agent-repeat-$attempt.exit
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Preserve complete comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: memmy-592-compare-agent-${{ matrix.revision }}-${{ matrix.runner }}-${{ github.run_attempt }}
          path: comparison-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Record diagnostic scope
        if: ${{ always() }}
        run: |
          printf '%s\n' 'Comparison only: original assertions are unchanged. Test failures remain failures. Baseline and candidate use the same OS image, Node version, dependency locks and commands.' >> "$GITHUB_STEP_SUMMARY"

  repository:
    if: github.repository == 'yxyi123/memmy-agent'
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && 'fa12bd06e0d1de9a4bf1e23f321b0e833d064c22' || '20b8eddd89f6d2374fe43ec050d481cad3a24d12' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record environment and revision
        run: |
          mkdir -p comparison-evidence
          git rev-parse HEAD > comparison-evidence/commit.txt
          node --version > comparison-evidence/node.txt
          npm --version > comparison-evidence/npm.txt
          uname -a > comparison-evidence/platform.txt
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Agent dependencies
        run: npm ci --prefix App/memmy-agent --no-audit --no-fund
      - name: Full repository regression with original assertions
        run: |
          set -o pipefail
          npm test 2>&1 | tee comparison-evidence/repository-full.log
      - name: Repeat Memory startup test three times
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -o pipefail
          failed=0
          for attempt in 1 2 3; do
            npm test -w @memmy/memory -- tests/agent-source-runtime.test.ts --reporter=default --reporter=json --outputFile=../comparison-evidence/memory-repeat-$attempt.json 2>&1 | tee comparison-evidence/memory-repeat-$attempt.log
            result=${PIPESTATUS[0]}
            printf '%s\n' "$result" > comparison-evidence/memory-repeat-$attempt.exit
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Memory layer smoke
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run smoke:memory-layer 2>&1 | tee comparison-evidence/smoke-memory-layer.log
      - name: Local Agent Memory smoke
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run smoke:local-agent-memory 2>&1 | tee comparison-evidence/smoke-local-agent-memory.log
      - name: Cursor Memory smoke
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run smoke:local-agent-memory:cursor 2>&1 | tee comparison-evidence/smoke-cursor.log
      - name: Preserve complete comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: memmy-592-compare-repository-${{ matrix.revision }}-${{ github.run_attempt }}
          path: comparison-evidence/
          if-no-files-found: error
          retention-days: 7
