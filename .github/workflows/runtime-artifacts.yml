name: Agent and Memory runtime artifacts
run-name: runtime-artifacts-${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime packages to build
        type: choice
        options: [both, memory]
        default: both
  push:
    branches: [zy_memory_runtime_*]
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - target: linux-x64
            runner: ubuntu-24.04
            arch: x64
          - target: windows-arm64
            runner: windows-11-arm
            arch: arm64
          - target: windows-x64
            runner: windows-2025
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      COPYFILE_DISABLE: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.0.0
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Agent build dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.runtime != 'memory'
        run: npm --prefix App/memmy-agent install --ignore-scripts --no-audit --no-fund
      - name: Build Agent runtime
        if: github.event_name == 'workflow_dispatch' && inputs.runtime != 'memory'
        run: npm run agent:runtime:package -- --target "${{ matrix.target }}" --output "$RUNNER_TEMP/runtime-artifacts"
      - name: Build Memory runtime
        run: npm run runtime:package -w @memmy/memory -- --target "${{ matrix.target }}" --output "$RUNNER_TEMP/runtime-artifacts"
      - name: Verify unpacked runtimes and native dependencies
        run: node scripts/internal/shared/verify-runtime-artifacts.mjs "$RUNNER_TEMP/runtime-artifacts" "${{ matrix.target }}" "${{ inputs.runtime || 'memory' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: runtimes-${{ matrix.target }}
          path: ${{ runner.temp }}/runtime-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  collect:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.0.0
      - uses: actions/download-artifact@v4
        with:
          pattern: runtimes-*
          path: runtime-input
      - name: Collect runtime archives with checksums
        run: node scripts/internal/shared/collect-runtime-artifacts.mjs runtime-input runtime-output "${{ inputs.runtime || 'memory' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: all-platform-runtimes
          path: runtime-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
