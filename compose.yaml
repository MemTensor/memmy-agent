services:
  memory:
    build:
      context: .
      dockerfile: Memory/Dockerfile
    image: memmy-memory:local
    restart: unless-stopped
    init: true
    environment:
      HOME: /home/node
      MEMMY_MEMORY_HOST: 0.0.0.0
      MEMMY_MEMORY_PORT: "18960"
      MEMMY_MEMORY_DB: /data/memory.sqlite
      MEMMY_MEMORY_TOKEN: "${MEMMY_MEMORY_TOKEN:?Set a strong random MEMMY_MEMORY_TOKEN in .env}"
      MEMMY_SUMMARY_PROVIDER: "${MEMMY_SUMMARY_PROVIDER:-openai_compatible}"
      MEMMY_SUMMARY_ENDPOINT: "${MEMMY_SUMMARY_ENDPOINT:-}"
      MEMMY_SUMMARY_MODEL: "${MEMMY_SUMMARY_MODEL:-auto/best-fast}"
      MEMMY_SUMMARY_API_KEY: "${MEMMY_SUMMARY_API_KEY:-}"
      MEMMY_SUMMARY_MAX_TOKENS: "${MEMMY_SUMMARY_MAX_TOKENS:-768}"
      MEMMY_SUMMARY_TIMEOUT_MS: "${MEMMY_SUMMARY_TIMEOUT_MS:-60000}"
      MEMMY_EVOLUTION_PROVIDER: "${MEMMY_EVOLUTION_PROVIDER:-openai_compatible}"
      MEMMY_EVOLUTION_ENDPOINT: "${MEMMY_EVOLUTION_ENDPOINT:-}"
      MEMMY_EVOLUTION_MODEL: "${MEMMY_EVOLUTION_MODEL:-auto/best-reasoning}"
      MEMMY_EVOLUTION_API_KEY: "${MEMMY_EVOLUTION_API_KEY:-}"
      MEMMY_EVOLUTION_ENABLE_THINKING: "${MEMMY_EVOLUTION_ENABLE_THINKING:-true}"
      MEMMY_EVOLUTION_MAX_TOKENS: "${MEMMY_EVOLUTION_MAX_TOKENS:-4096}"
      MEMMY_EVOLUTION_TIMEOUT_MS: "${MEMMY_EVOLUTION_TIMEOUT_MS:-180000}"
    ports:
      - "127.0.0.1:${MEMMY_MEMORY_HOST_PORT:-18960}:18960"
    volumes:
      - memory-data:/data
      - memory-model-cache:/home/node/.memmy/memory-service/model-cache
      - ${HOME}/.pi/agent/sessions:/home/node/.pi/agent/sessions:ro
      - ${HOME}/.codex/sessions:/home/node/.codex/sessions:ro
      - ${HOME}/.claude/transcripts:/home/node/.claude/transcripts:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18960/api/v1/health').then(r=>{if(!r.ok)throw new Error(String(r.status))})
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  memory-data:
  memory-model-cache:
