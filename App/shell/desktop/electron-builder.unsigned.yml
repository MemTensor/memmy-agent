appId: cn.memtensor.memmy
productName: Memmy
artifactName: Memmy-${version}-${arch}-unsigned.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/node_modules/*/{test,tests,__tests__,doc,docs,example,examples,coverage,.github}"
  - "!**/node_modules/*/{test,tests,__tests__,doc,docs,example,examples,coverage,.github}/**/*"
  - "!**/node_modules/@*/*/{test,tests,__tests__,doc,docs,example,examples,coverage,.github}"
  - "!**/node_modules/@*/*/{test,tests,__tests__,doc,docs,example,examples,coverage,.github}/**/*"
  - "!**/node_modules/**/*.{test,spec}.*"
  - "!**/node_modules/**/{README,README*.md,README*.mdown,README*.markdown,README*.rst,README*.txt,CHANGELOG,CHANGELOG*.md,CHANGELOG*.mdown,CHANGELOG*.markdown,CHANGELOG*.rst,CHANGELOG*.txt,CONTRIBUTING,CONTRIBUTING*.md,CONTRIBUTING*.mdown,CONTRIBUTING*.markdown,CONTRIBUTING*.rst,CONTRIBUTING*.txt,CODE_OF_CONDUCT,CODE_OF_CONDUCT*.md,CODE_OF_CONDUCT*.mdown,CODE_OF_CONDUCT*.markdown,CODE_OF_CONDUCT*.rst,CODE_OF_CONDUCT*.txt,SECURITY,SECURITY*.md,SECURITY*.mdown,SECURITY*.markdown,SECURITY*.rst,SECURITY*.txt}"

asar: true
asarUnpack:
  - "**/*.node"
  - "**/onnxruntime-node/bin/napi-v3/darwin/**/*.dylib"
  - "**/@img/sharp-libvips-darwin-*/lib/libvips*.dylib"
  - "**/@lydell/node-pty-darwin-*/prebuilds/darwin-*/spawn-helper"
  - "**/node_modules/sqlite-vec-*/vec0.*"
  - "dist/runtime/memmy-agent/node_modules/@memmy/migrations/**"
  - "dist/renderer/**"

extraResources:
  - from: dist/runtime/bin
    to: cli
    filter:
      - "**/*"
  - from: build/MenuBarIconTemplate.png
    to: MenuBarIconTemplate.png
  - from: build/MenuBarIconTemplate@2x.png
    to: MenuBarIconTemplate@2x.png
  - from: dist/embedding-models
    to: embedding-models
    filter:
      - "**/*"
  - from: ../../../.env
    to: .env

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  extendInfo:
    NSMicrophoneUsageDescription: "Memmy uses the microphone only when you start voice input."
  target:
    - target: dmg
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  forceCodeSigning: false
  notarize: false

dmg:
  title: Memmy Installer
  icon: build/icon.icns
  background: build/dmg-background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 200
    - x: 410
      y: 200
      type: link
      path: /Applications
