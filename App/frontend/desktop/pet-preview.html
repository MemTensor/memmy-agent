<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memmy 桌宠动画预览</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #312a26; background: #f5f0e8; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; }
      main { max-width: 860px; margin: auto; }
      h1 { font-size: 25px; margin: 0 0 8px; }
      p { margin: 0 0 22px; color: #71665c; line-height: 1.5; }
      .panels { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 20px; }
      section { background: #fffdfa; border: 1px solid #e6dbcd; border-radius: 20px; overflow: hidden; box-shadow: 0 12px 30px #786a5d14; }
      h2 { font-size: 15px; margin: 0; padding: 18px 20px 0; }
      .stage { aspect-ratio: 1; display: grid; place-items: center; background: radial-gradient(circle, #fffdf8 0%, #f8f2e9 72%); }
      canvas { display: block; width: 100%; height: 100%; }
      .actual { width: 120px; height: 120px; }
      .controls { display: flex; gap: 12px; align-items: center; padding: 16px 20px 20px; }
      button { border: 0; border-radius: 10px; background: #765947; color: white; padding: 9px 16px; font-size: 14px; cursor: pointer; }
      input { flex: 1; min-width: 0; accent-color: #a77450; }
      output { min-width: 72px; font-variant-numeric: tabular-nums; text-align: right; }
      .hint { padding: 0 20px 18px; font-size: 13px; line-height: 1.5; color: #80756b; }
      @media (max-width: 650px) { body { padding: 16px; } .panels { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Memmy 的小小心事</h1>
      <p>一段 12 秒的桌宠待机循环。首帧保留气泡，开场破灭后持续隐藏；左边可看动作细节，右边是桌面上实际的 120 像素尺寸。</p>
      <div class="panels">
        <section>
          <h2>动画预览</h2>
          <div class="stage"><canvas id="pet" width="480" height="480" aria-label="Memmy 桌宠动画"></canvas></div>
          <div class="controls">
            <button id="play" type="button">暂停</button>
            <input id="seek" type="range" min="0" max="12" step="0.01" value="0" aria-label="动画进度" />
            <output id="time">0.0 秒</output>
          </div>
          <div id="status" class="hint">加载中…</div>
        </section>
        <section>
          <h2>桌面实际大小</h2>
          <div class="stage"><canvas id="pet-small" class="actual" width="120" height="120" aria-label="120 像素的 Memmy 桌宠"></canvas></div>
          <div class="hint">首帧采用你提供的图片。气泡只在开场出现，破灭后一直隐藏，角色与木勺保持原来的质感。</div>
        </section>
      </div>
    </main>
    <script type="module" src="/pet-preview.ts"></script>
  </body>
</html>
